server:
  port: 8082

spring:
  application:
    name: couple-service

  datasource:
    url: jdbc:postgresql://localhost:5434/couple_db
    username: starlyvia
    password: starlyvia
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

auth:
  grpc:
    host: ${AUTH_GRPC_HOST:localhost}
    port: ${AUTH_GRPC_PORT:9091}

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topics:
      couple-requested: couple.requested
      couple-accepted: couple.accepted
      couple-rejected: couple.rejected
      couple-removed: couple.removed
