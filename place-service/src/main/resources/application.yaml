server:
  port: 8084

spring:
  application:
    name: place-service

place:
  provider:
    google:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
