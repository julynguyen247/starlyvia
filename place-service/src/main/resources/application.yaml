server:
  port: 8084

spring:
  application:
    name: place-service

place:
  provider:
    geoapify:
      api-key: ${GEOAPIFY_API_KEY:}
      base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com}
      nearby-categories: ${GEOAPIFY_NEARBY_CATEGORIES:accommodation,catering,commercial,entertainment,leisure,tourism}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
