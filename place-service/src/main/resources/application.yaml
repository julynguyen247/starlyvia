server:
  port: 8084

spring:
  application:
    name: place-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

app:
  cache:
    redis:
      enabled: ${APP_PLACE_CACHE_ENABLED:true}
      autocomplete-ttl: ${APP_PLACE_CACHE_AUTOCOMPLETE_TTL:2m}
      nearby-ttl: ${APP_PLACE_CACHE_NEARBY_TTL:10m}
      details-ttl: ${APP_PLACE_CACHE_DETAILS_TTL:24h}

place:
  provider:
    geoapify:
      api-key: ${GEOAPIFY_API_KEY:}
      base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com}
      nearby-categories: ${GEOAPIFY_NEARBY_CATEGORIES:accommodation,catering,commercial,education,healthcare,entertainment,leisure,tourism,service,religion,sport,public_transport,parking,rental,childcare}

management:
  health:
    redis:
      enabled: ${APP_PLACE_CACHE_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
      show-details: never
