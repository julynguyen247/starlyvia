services:
  kafka:
    image: apache/kafka:4.2.1
    container_name: starlyvia-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    volumes:
      - kafka-data-v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-postgres:
    image: postgres:16-alpine
    container_name: starlyvia-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: starlyvia
      POSTGRES_PASSWORD: starlyvia
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlyvia -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  group-postgres:
    image: postgres:16-alpine
    container_name: starlyvia-group-postgres
    environment:
      POSTGRES_DB: group_db
      POSTGRES_USER: starlyvia
      POSTGRES_PASSWORD: starlyvia
    ports:
      - "5434:5432"
    volumes:
      - group-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlyvia -d group_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  plan-postgres:
    image: postgres:16-alpine
    container_name: starlyvia-plan-postgres
    environment:
      POSTGRES_DB: plan_db
      POSTGRES_USER: starlyvia
      POSTGRES_PASSWORD: starlyvia
    ports:
      - "5435:5432"
    volumes:
      - plan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlyvia -d plan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:16-alpine
    container_name: starlyvia-notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: starlyvia
      POSTGRES_PASSWORD: starlyvia
    ports:
      - "5436:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlyvia -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: starlyvia-auth-service
    depends_on:
      kafka:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: starlyvia
      SPRING_DATASOURCE_PASSWORD: starlyvia
      JWT_SECRET: ${JWT_SECRET:-starlyvia-super-secret-key-starlyvia-super-secret-key}
      JWT_EXPIRATION: 36000000
      GRPC_SERVER_PORT: 9091
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  group-service:
    build:
      context: ./group-service
    container_name: starlyvia-group-service
    depends_on:
      kafka:
        condition: service_healthy
      group-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://group-postgres:5432/group_db
      SPRING_DATASOURCE_USERNAME: starlyvia
      SPRING_DATASOURCE_PASSWORD: starlyvia
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      GRPC_SERVER_PORT: 9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  plan-service:
    build:
      context: ./plan-service
    container_name: starlyvia-plan-service
    depends_on:
      kafka:
        condition: service_healthy
      plan-postgres:
        condition: service_healthy
      group-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://plan-postgres:5432/plan_db
      SPRING_DATASOURCE_USERNAME: starlyvia
      SPRING_DATASOURCE_PASSWORD: starlyvia
      GROUP_GRPC_HOST: group-service
      GROUP_GRPC_PORT: 9092
      ROUTING_GRPC_HOST: routing-service
      ROUTING_GRPC_PORT: 9093
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  place-service:
    build:
      context: ./place-service
    container_name: starlyvia-place-service
    environment:
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: ./notification-service
    container_name: starlyvia-notification-service
    depends_on:
      kafka:
        condition: service_healthy
      notification-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: starlyvia
      SPRING_DATASOURCE_PASSWORD: starlyvia
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  routing-service:
    build:
      context: ./routing-service
    container_name: starlyvia-routing-service
    environment:
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      GRPC_SERVER_PORT: 9093
    ports:
      - "8086:8086"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: starlyvia-api-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      group-service:
        condition: service_healthy
      plan-service:
        condition: service_healthy
      place-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
    environment:
      NOTIFICATION_WEBSOCKET_URL: ws://notification-service:8085
      AUTH_SERVICE_URL: http://auth-service:8081
      GROUP_SERVICE_URL: http://group-service:8082
      PLAN_SERVICE_URL: http://plan-service:8083
      PLACE_SERVICE_URL: http://place-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      ROUTING_SERVICE_URL: http://routing-service:8086
      JWT_SECRET: ${JWT_SECRET:-starlyvia-super-secret-key-starlyvia-super-secret-key}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kafka-data-v2:
  auth-postgres-data:
  group-postgres-data:
  plan-postgres-data:
  notification-postgres-data:
