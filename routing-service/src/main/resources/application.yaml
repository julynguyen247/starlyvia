server:
  port: 8086

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9093}

spring:
  application:
    name: routing-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

app:
  cache:
    redis:
      enabled: ${APP_ROUTING_CACHE_ENABLED:true}
      route-ttl: ${APP_ROUTING_CACHE_TTL:30m}

routing:
  provider:
    openrouteservice:
      api-key: ${OPENROUTESERVICE_API_KEY:}
      base-url: ${OPENROUTESERVICE_BASE_URL:https://api.openrouteservice.org}

management:
  health:
    redis:
      enabled: ${APP_ROUTING_CACHE_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
      show-details: never
