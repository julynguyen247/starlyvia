server:
  port: 8083

group:
  grpc:
    host: ${GROUP_GRPC_HOST:localhost}
    port: ${GROUP_GRPC_PORT:9092}

spring:
  application:
    name: plan-service

  datasource:
    url: jdbc:postgresql://localhost:5435/plan_db
    username: starlyvia
    password: starlyvia
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topics:
      plan-events: plan.events
