server:
  port: 8083

group:
  grpc:
    host: ${GROUP_GRPC_HOST:localhost}
    port: ${GROUP_GRPC_PORT:9092}

spring:
  application:
    name: plan-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/plan_db}
    username: ${SPRING_DATASOURCE_USERNAME:starlyvia}
    password: ${SPRING_DATASOURCE_PASSWORD:starlyvia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topics:
      plan-events: plan.events

routing:
  grpc:
    host: ${ROUTING_GRPC_HOST:localhost}
    port: ${ROUTING_GRPC_PORT:9093}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
