spring:
  datasource:
    url: jdbc:h2:mem:notification-service-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-service-test

app:
  kafka:
    enabled: false
