server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                  - "http://localhost:8080"
                  - "http://127.0.0.1:8080"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                  - Location
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-service-openapi
              uri: ${auth.service.url}
              predicates:
                - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
            - id: auth-service
              uri: ${auth.service.url}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - JwtValidation
            - id: group-service
              uri: ${group.service.url}
              predicates:
                - Path=/api/v1/groups/**
              filters:
                - JwtValidation
            - id: plan-service-plans
              uri: ${plan.service.url}
              predicates:
                - Path=/api/v1/plans/**
              filters:
                - JwtValidation
            - id: plan-service-plan-stops
              uri: ${plan.service.url}
              predicates:
                - Path=/api/v1/plan-stops/**
              filters:
                - JwtValidation
            - id: place-service
              uri: ${place.service.url}
              predicates:
                - Path=/api/v1/places/**
              filters:
                - JwtValidation
            - id: notification-service
              uri: ${notification.service.url}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - JwtValidation
            - id: routing-service
              uri: ${routing.service.url}
              predicates:
                - Path=/api/v1/routes/**
              filters:
                - JwtValidation

auth:
  service:
    url: http://localhost:8081

group:
  service:
    url: http://localhost:8082

plan:
  service:
    url: http://localhost:8083

place:
  service:
    url: http://localhost:8084

notification:
  service:
    url: http://localhost:8085

routing:
  service:
    url: http://localhost:8086

jwt:
  secret: "starlyvia-super-secret-key-starlyvia-super-secret-key"
